name: Deploy OpenPlanner Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openplanner-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OpenPlanner staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROMETHEAN_SSH_PRIVATE_KEY }}" > ~/.ssh/promethean
          chmod 600 ~/.ssh/promethean
          ssh-keyscan -H "${{ vars.PROMETHEAN_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          OPENPLANNER_REMOTE_SOURCE_PATH: ${{ vars.OPENPLANNER_REMOTE_SOURCE_PATH }}
          OPENPLANNER_PM2_NAME: ${{ vars.OPENPLANNER_PM2_NAME }}
          OPENPLANNER_HEALTH_URL: ${{ vars.OPENPLANNER_HEALTH_URL }}
          OPENPLANNER_PORT: ${{ vars.OPENPLANNER_PORT }}
        run: scripts/deploy-promethean-openplanner.sh
