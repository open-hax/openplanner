name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openplanner-staging
  cancel-in-progress: true

jobs:
  staging-preflight:
    name: staging-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenPlanner quality gates
        run: |
          pnpm run build
          pnpm test

  deploy-staging:
    name: deploy-staging
    needs: staging-preflight
    uses: open-hax/services/.github/workflows/deploy-promethean.yml@main
    with:
      environment: staging
      service: openplanner
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      checkout_submodules: false
    secrets: inherit
