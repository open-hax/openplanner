name: Production Release Preflight

# Application validation stays with OpenPlanner. The production data plane is
# consumed in-process by Knoxx, and stack deployment is centrally authorized by
# a reviewed open-hax/services PR carrying `deploy`. This workflow intentionally
# contains no deployment job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openplanner-production-preflight
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenPlanner production gates
        run: |
          pnpm run build
          pnpm test
